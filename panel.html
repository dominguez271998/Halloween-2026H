<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - Organización</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #ff6b00;
      --text: #e0e0e0;
      --success: #22c55e;
      --warning: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    h1 { color: var(--accent); font-size: 1.5rem; }

    .btn-approve-all {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(255, 107, 0, 0.3);
      transition: transform 0.1s ease;
    }
    .btn-approve-all:hover { opacity: 0.9; }
    .btn-approve-all:active { transform: scale(0.97); }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid #333; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: bold; color: var(--accent); margin-top: 5px; }
    
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; }
    th { background: #252525; color: #aaa; font-size: 0.85rem; text-transform: uppercase; }
    
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .badge-pending { background: rgba(234, 179, 8, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .badge-active { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #60a5fa; }
    .badge-done { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }

    .btn-action {
      border: none;
      padding: 6px 10px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-right: 5px;
    }

    .btn-approve { background: var(--success); color: #000; }
    .btn-loc { background: #3b82f6; color: #fff; }
    .btn-loc-no { background: #4b5563; color: #d1d5db; }

    .hidden { display: none !important; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 1000;
    }

    .modal-content {
      background: #1e1e1e;
      border: 1px solid var(--accent);
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      padding: 20px;
      text-align: center;
    }

    #panel-map {
      width: 100%;
      height: 380px;
      border-radius: 8px;
      border: 1px solid #444;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Centro de Control - Escape Room</h1>
      <div id="last-update" style="color: #888; font-size: 0.85rem; margin-top: 4px;">Actualizando...</div>
    </div>
    
    <button class="btn-approve-all" onclick="approveAllTeams()">🚀 Dar Salida a Todos</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div>Equipos Totales</div>
      <div id="stat-total" class="stat-value">0</div>
    </div>
    <div class="stat-card">
      <div>Pendientes Salida</div>
      <div id="stat-pending" class="stat-value" style="color: var(--warning);">0</div>
    </div>
    <div class="stat-card">
      <div>En Juego</div>
      <div id="stat-active" class="stat-value" style="color: #60a5fa;">0</div>
    </div>
    <div class="stat-card">
      <div>Finalizados</div>
      <div id="stat-done" class="stat-value" style="color: var(--success);">0</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Equipo</th>
        <th>Estado</th>
        <th>Estación Inicial</th>
        <th>Hora Salida</th>
        <th>Hora Llegada</th>
        <th>Tiempo Total</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="7" style="text-align:center;">Cargando datos del servidor...</td></tr>
    </tbody>
  </table>

  <div id="modal-panel-map" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 id="panel-map-title" style="color: var(--accent);">Ubicación del Equipo</h3>
      
      <div id="panel-map"></div>

      <button class="btn-approve-all" style="width: 100%;" onclick="closePanelMap()">Cerrar Mapa</button>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzH1DLfJbe-Rh65ga9XxgIbHDJZDLh_DSMrUm9jKJ18N6LNEEBYkteImOJ-W_CunwRb/exec";

  let panelMap = null;
  let panelMapMarker = null;
  let currentTrackedTeam = null;

  function formatTime(val) {
    if (!val) return '-';
    let str = String(val).trim();
    if (str.includes('T')) {
      let parts = str.split('T');
      if (parts.length > 1) {
        return parts[1].split('.')[0];
      }
    }
    return str;
  }

  function cleanCoordinate(coord, isLat) {
    if (coord === null || coord === undefined || coord === "") return null;
    let str = String(coord).trim().replace(',', '.');
    let num = parseFloat(str);
    if (isNaN(num)) return null;

    let maxLimit = isLat ? 90 : 180;
    while (Math.abs(num) > maxLimit) {
      num = num / 10;
    }
    return num;
  }

  async function loadDashboard() {
    try {
      const res = await fetch(`${WEB_APP_URL}?action=getData`);
      const data = await res.json();

      let pendingCount = 0;
      let activeCount = 0;
      let doneCount = 0;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = data.slice().reverse().map(item => {
        let badgeClass = "badge-pending";
        if (item.status === "En curso") { badgeClass = "badge-active"; activeCount++; }
        else if (item.status === "Finalizado") { badgeClass = "badge-done"; doneCount++; }
        else { pendingCount++; }

        let actions = [];

        if (item.status === "Pendiente") {
          actions.push(`<button class="btn-action btn-approve" onclick="approveStart('${escapeHtml(item.team)}')">🟢 Salida</button>`);
        }

        const latClean = cleanCoordinate(item.lat, true);
        const lngClean = cleanCoordinate(item.lng, false);

        // SOLO MOSTRAR UBICACIÓN SI EL EQUIPO NO HA FINALIZADO
        if (item.status !== "Finalizado") {
          if (latClean !== null && lngClean !== null) {
            actions.push(`<button class="btn-action btn-loc" onclick="showTeamLocation('${escapeHtml(item.team)}', '${latClean}', '${lngClean}')">📍 Ubicación</button>`);
          } else {
            actions.push(`<button class="btn-action btn-loc-no" onclick="showNoLocation('${escapeHtml(item.team)}')">📍 Sin GPS</button>`);
          }
        }

        // SI EL MAPA ESTÁ ABIERTO Y EL EQUIPO FINALIZA, SE CIERRA EL MAPA
        if (currentTrackedTeam && item.team === currentTrackedTeam) {
          if (item.status === "Finalizado") {
            closePanelMap();
          } else if (panelMap && panelMapMarker && latClean !== null && lngClean !== null) {
            panelMapMarker.setLatLng([latClean, lngClean]);
            panelMap.panTo([latClean, lngClean]);
          }
        }

        const actionsContent = actions.length > 0 ? actions.join(' ') : '<span style="color:#666; font-size:0.85rem;">-</span>';

        return `
          <tr>
            <td><strong>${escapeHtml(item.team)}</strong></td>
            <td><span class="badge ${badgeClass}">${item.status}</span></td>
            <td>${escapeHtml(item.station || '-')}</td>
            <td>${formatTime(item.startTime)}</td>
            <td>${formatTime(item.endTime)}</td>
            <td><strong>${formatTime(item.totalTime)}</strong></td>
            <td>${actionsContent}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('stat-total').innerText = data.length;
      document.getElementById('stat-pending').innerText = pendingCount;
      document.getElementById('stat-active').innerText = activeCount;
      document.getElementById('stat-done').innerText = doneCount;
      document.getElementById('last-update').innerText = "Última actualización: " + new Date().toLocaleTimeString();

    } catch (err) {
      console.error("Error al actualizar panel:", err);
    }
  }

  async function approveStart(teamName) {
    try {
      await fetch(`${WEB_APP_URL}?action=approve&teamName=${encodeURIComponent(teamName)}`);
      loadDashboard();
    } catch (err) {
      alert("Error al dar salida al equipo.");
    }
  }

  async function approveAllTeams() {
    if (!confirm("¿Estás seguro de que deseas dar la salida a TODOS los equipos pendientes a la vez?")) return;

    try {
      const res = await fetch(`${WEB_APP_URL}?action=approveAll`);
      const data = await res.json();
      if (data.status === "OK") {
        alert(`¡Salida dada a ${data.count} equipo(s) correctamente!`);
        loadDashboard();
      }
    } catch (err) {
      alert("Error de conexión al dar la salida masiva.");
    }
  }

  function showTeamLocation(teamName, rawLat, rawLng) {
    const lat = cleanCoordinate(rawLat, true);
    const lng = cleanCoordinate(rawLng, false);

    if (lat === null || lng === null) {
      alert("Coordenadas no válidas recibidas para este equipo.");
      return;
    }

    currentTrackedTeam = teamName;
    document.getElementById('panel-map-title').innerText = `📍 Ubicación: ${teamName}`;
    document.getElementById('modal-panel-map').classList.remove('hidden');

    setTimeout(() => {
      if (panelMap) {
        panelMap.remove();
        panelMap = null;
      }

      panelMap = L.map('panel-map').setView([lat, lng], 17);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: 'OpenStreetMap'
      }).addTo(panelMap);

      panelMapMarker = L.marker([lat, lng]).addTo(panelMap)
        .bindPopup(`<strong>${teamName}</strong><br>Rastreando ubicación en tiempo real...`)
        .openPopup();

      panelMap.invalidateSize();
    }, 300);
  }

  function showNoLocation(teamName) {
    alert(`El equipo "${teamName}" aún no ha enviado coordenadas GPS válidas.`);
  }

  function closePanelMap() {
    currentTrackedTeam = null;
    document.getElementById('modal-panel-map').classList.add('hidden');
    if (panelMap) {
      panelMap.remove();
      panelMap = null;
    }
  }

  function escapeHtml(text) {
    return text ? text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : '';
  }

  loadDashboard();
  setInterval(loadDashboard, 4000);
</script>

</body>
</html>
