<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Prueba Realidad Aumentada - Escape Room</title>

  <!-- A-Frame VR Framework -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js para A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .ar-overlay {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 13, 13, 0.85);
      color: #ff6b00;
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid #ff6b00;
      font-weight: bold;
      z-index: 9999;
      text-align: center;
      font-size: 0.9rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      width: 85%;
      max-width: 380px;
    }

    .btn-close {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff6b00;
      color: #000;
      border: none;
      padding: 12px 28px;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      z-index: 9999;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(255, 107, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="ar-overlay">
    👻 Apunta la cámara al marcador de la estación
  </div>

  <button class="btn-close" onclick="window.history.back()">Volver al Juego</button>

  <!-- Escena AR WebGL -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Marcador HIRO (Símbolo físico que escanea la cámara) -->
    <a-marker preset="hiro">
      
      <!-- Cubo 3D giratorio color naranja -->
      <a-box position="0 0.5 0" 
             material="color: #ff6b00; opacity: 0.9;" 
             animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
      </a-box>

      <!-- Texto en Realidad Aumentada que flota sobre el cubo -->
      <a-text value="CLAVE: SOMBRA2026" 
              position="-1.1 1.3 0" 
              color="#ffffff" 
              scale="1.2 1.2 1.2">
      </a-text>

    </a-marker>

    <!-- Cámara virtual -->
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
