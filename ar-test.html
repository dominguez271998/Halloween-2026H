<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Prueba RA - Fantasma 3D</title>

  <!-- A-Frame VR Framework -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js para A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Extras para animaciones 3D GLTF -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }

    .ar-overlay {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 13, 13, 0.88);
      color: #ff6b00;
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid #ff6b00;
      font-weight: bold;
      z-index: 9999;
      text-align: center;
      font-size: 0.9rem;
      width: 85%;
      max-width: 380px;
    }

    .btn-close {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff6b00;
      color: #000;
      border: none;
      padding: 12px 28px;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      z-index: 9999;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(255, 107, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="ar-overlay">
    👻 Apunta la cámara al escudo de Huércal
  </div>

  <button class="btn-close" onclick="window.history.back()">Volver al Juego</button>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-assets>
      <!-- Carga de modelo GLB (Un solo archivo con geografía, colores y animaciones incluidas) -->
      <a-asset-item id="modelo-fantasma" src="https://raw.githack.com/n5ro/aframe-physics-system/master/examples/assets/models/ghost.glb"></a-asset-item>
    </a-assets>

    <!-- MARCADOR ESCUDO -->
    <a-marker type="pattern" url="pattern-escudo.patt" id="marker-escudo">
      
      <!-- LUZ ESPACIAL -->
      <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
      <a-light type="point" color="#ff6b00" intensity="2" position="0 2 1"></a-light>

      <!-- FANTASMA 3D ANIMADO -->
      <a-entity gltf-model="#modelo-fantasma"
                position="0 0.2 0"
                scale="0.8 0.8 0.8"
                animation-mixer
                animation="property: position; to: 0 0.6 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
      </a-entity>

      <!-- CARTEL CON CLAVE -->
      <a-plane position="0 2.2 0" width="2.6" height="0.8" color="#000000" material="opacity: 0.85; transparent: true">
        <a-text value="¡HAS ENCONTRADO EL ESPECTRO!\nClave: AQUELARRE" 
                align="center" 
                width="2.4" 
                color="#ff6b00" 
                position="0 0 0.02">
        </a-text>
      </a-plane>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

<script>
  let hasSpoken = false;

  document.querySelector('#marker-escudo').addEventListener('markerFound', () => {
    if (!hasSpoken) {
      hasSpoken = true;
      if ('speechSynthesis' in window) {
        const mensaje = new SpeechSynthesisUtterance("Has encontrado al espectro de Huércal. Tu palabra clave es Aquelarre.");
        mensaje.lang = 'es-ES';
        mensaje.pitch = 0.4;
        mensaje.rate = 0.8;
        window.speechSynthesis.speak(mensaje);
      }
    }
  });

  document.querySelector('#marker-escudo').addEventListener('markerLost', () => {
    hasSpoken = false;
  });
</script>

</body>
</html>
