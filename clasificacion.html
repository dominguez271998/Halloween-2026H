<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clasificación En Directo - La Sombra de Huércal</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card: #141419;
      --accent: #ff6b00;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: #fff; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 700px; }
    header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--accent); padding-bottom: 15px; }
    h1 { color: var(--accent); font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; }
    .subtitle { color: #888; font-size: 0.9rem; margin-top: 5px; }
    .meta { color: #888; font-size: 0.85rem; margin-top: 8px; font-variant-numeric: tabular-nums; }
    .meta.error { color: #f87171; }

    .leaderboard { display: flex; flex-direction: column; gap: 10px; }
    .row { background: var(--card); border: 1px solid #222; border-radius: 10px; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .rank { font-size: 1.4rem; font-weight: bold; width: 52px; flex: none; color: #666; }
    .rank-1 { color: var(--gold); }
    .rank-2 { color: var(--silver); }
    .rank-3 { color: var(--bronze); }
    .team-info { flex: 1; min-width: 0; margin-left: 4px; }
    .team-name { font-size: 1.1rem; font-weight: bold; overflow-wrap: anywhere; }
    .team-time { font-size: 1.3rem; font-weight: bold; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .empty-msg { text-align: center; color: #666; padding: 40px 0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>La Sombra de Huércal</h1>
    <p class="subtitle">Ranking Oficial de Equipos en Tiempo Real</p>
    <p id="meta" class="meta" role="status" aria-live="polite">&nbsp;</p>
  </header>

  <div id="leaderboard" class="leaderboard">
    <div class="empty-msg">Cargando clasificación...</div>
  </div>
</div>

<script src="config.js"></script>
<script>
(() => {
  'use strict';
  const CFG = window.ESCAPE_CONFIG;
  if (!CFG) { document.body.innerHTML = '<p style="padding:24px;color:#ef4444">No se ha podido cargar config.js.</p>'; return; }

  const REFRESH_MS = 15000;     // el servidor guarda la respuesta 5 s: cientos de pantallas no lo saturan
  const MEDAL = ['🥇', '🥈', '🥉'];
  const $ = (id) => document.getElementById(id);
  let loading = false, lastOk = 0;

  const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));

  function render(d) {
    const box = $('leaderboard');
    if (!d.items.length) {
      box.innerHTML = '<div class="empty-msg">Ningún equipo ha completado la misión aún.</div>';
    } else {
      let rank = 0, prev = null;                 // empate = mismo puesto
      box.innerHTML = d.items.map((it, i) => {
        if (it.secs !== prev) { rank = i + 1; prev = it.secs; }
        const cls = rank <= 3 ? ` rank-${rank}` : '';
        return `<div class="row">
          <div class="rank${cls}">${rank <= 3 ? MEDAL[rank - 1] : '#' + rank}</div>
          <div class="team-info"><div class="team-name">${esc(it.team)}</div></div>
          <div class="team-time">${esc(it.totalTime)}</div>
        </div>`;
      }).join('');
    }
    const m = $('meta');
    m.className = 'meta';
    m.textContent = `${d.playing} en juego · ${d.items.length} finalizados · ${d.registered} registrados`;
  }

  async function load() {
    if (loading || document.hidden) return;
    loading = true;
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), 12000);
    try {
      const res = await fetch(`${CFG.WEB_APP_URL}?action=leaderboard`, { signal: controller.signal });
      const d = JSON.parse(await res.text());
      if (d.status !== 'OK' || !Array.isArray(d.items)) throw new Error(d.status || 'BAD');
      lastOk = Date.now();
      render(d);
    } catch (e) {
      // se conserva la última clasificación en pantalla y solo se avisa
      const m = $('meta');
      m.className = 'meta error';
      m.textContent = lastOk ? 'Sin conexión: se muestra la última clasificación recibida.' : 'No se pudo cargar la clasificación. Reintentando...';
    } finally { clearTimeout(id); loading = false; }
  }

  load();
  setInterval(load, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>

</body>
</html>
